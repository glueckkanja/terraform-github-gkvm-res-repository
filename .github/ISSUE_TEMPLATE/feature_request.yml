---
name: Feature request 💡
description: Suggest a capability for this module
labels: ['enhancement']

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that this module does not support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The inputs, outputs or resources you would expect. Include the GitHub provider resource or attribute involved, if you know it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
